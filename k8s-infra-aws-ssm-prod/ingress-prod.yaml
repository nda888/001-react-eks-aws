apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elb-react-eks-prod
  namespace: prod
  annotations:
    alb.ingress.kubernetes.io/group.name: elb-react-eks-prod
    alb.ingress.kubernetes.io/group.order: "1"
    alb.ingress.kubernetes.io/load-balancer-name: elb-react-eks-prod
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Substituted at deploy time from terraform output edge_public_subnet_ids (script: deploy-eks-aws-ssm-react.sh).
    alb.ingress.kubernetes.io/subnets: PLACEHOLDER_PROD_SUBNETS
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:__AWS_ACCOUNT_ID__:certificate/ed9119c0-c6a7-49ac-84cf-ded38b29491c
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    alb.ingress.kubernetes.io/tags: Project=demo-eks-prod,Environment=prod,ManagedBy=kubernetes,Name=elb-react-eks-prod
    alb.ingress.kubernetes.io/security-groups: PLACEHOLDER_FRONTEND_SG,PLACEHOLDER_BACKEND_SG
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
spec:
  ingressClassName: alb
  rules:
    - host: react-eks.h0m3.xyz
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
