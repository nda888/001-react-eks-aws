apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitor
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: react-app-dev
        orgId: 1
        folder: Dev
        folderUid: PLACEHOLDER_DEV_FOLDER_UID
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/dev
      - name: react-app-uat
        orgId: 1
        folder: Uat
        folderUid: PLACEHOLDER_UAT_FOLDER_UID
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/uat
      - name: react-app-logs
        orgId: 1
        folder: Logs
        folderUid: PLACEHOLDER_LOGS_FOLDER_UID
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/logs
      - name: react-app-prod
        orgId: 1
        folder: Prod
        folderUid: PLACEHOLDER_PROD_FOLDER_UID
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/prod
