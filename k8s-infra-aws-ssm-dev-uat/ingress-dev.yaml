apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-react-eks
  namespace: dev
  annotations:
    alb.ingress.kubernetes.io/group.name: demo-react-eks-dev
    alb.ingress.kubernetes.io/group.order: "1"
    alb.ingress.kubernetes.io/load-balancer-name: elb-react-eks-dev-uat
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/subnets: subnet-0ca21f0f484edd27d,subnet-0d5b19984b533f703
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:__AWS_ACCOUNT_ID__:certificate/ed9119c0-c6a7-49ac-84cf-ded38b29491c
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    # Target group
    # 15s interval + 2 thresholds gives about 30s healthy/unhealthy detection.
    # 5s timeout is safe because /healthz is lightweight.
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/success-codes: "200"
    
    # 30s deregistration delay avoids AWS default 300s stale-target draining.
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30

    alb.ingress.kubernetes.io/tags: Project=demo-eks-dev,Environment=shared,ManagedBy=kubernetes,Name=elb-react-eks-dev-uat
    # WARNING: do NOT rename load-balancer-name or group.name — AWS will destroy + recreate the ALB (DNS outage).
    # Only the host rule below was changed for the dev-react-eks.h0m3.xyz domain rename.
    alb.ingress.kubernetes.io/security-groups: PLACEHOLDER_FRONTEND_SG,PLACEHOLDER_BACKEND_SG
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
spec:
  ingressClassName: alb
  rules:
    - host: dev-react-eks.h0m3.xyz
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
