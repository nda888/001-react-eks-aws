apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-token-secret
  namespace: uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: api-token-secret
    creationPolicy: Owner
  data:
    - secretKey: API_TOKEN
      remoteRef:
        key: /demo-eks-uat/app/api_token
