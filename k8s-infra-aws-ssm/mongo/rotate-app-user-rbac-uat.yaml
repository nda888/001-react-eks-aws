apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mongo-credential-rotator
  namespace: uat
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mongo-app-secret", "mongo-root-secret"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongo-credential-rotator
  namespace: uat
subjects:
  - kind: ServiceAccount
    name: mongo-credential-rotator
    namespace: uat
roleRef:
  kind: Role
  name: mongo-credential-rotator
  apiGroup: rbac.authorization.k8s.io
