apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-image-renderer
  namespace: dev
  labels:
    app: grafana-image-renderer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-image-renderer
  template:
    metadata:
      labels:
        app: grafana-image-renderer
    spec:
      containers:
        - name: grafana-image-renderer
          image: grafana/grafana-image-renderer:4.1.5
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-image-renderer
                  key: auth-token
            - name: TZ
              value: Asia/Bangkok
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /render/version
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /render/version
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
