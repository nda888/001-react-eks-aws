apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: dev
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: demo-app
        orgId: 1
        folder: Demo App
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
