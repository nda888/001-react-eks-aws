apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitor
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - us-east-1a
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: fix-grafana-data-permissions
          image: busybox:1.36
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command: ["sh", "-c", "mkdir -p /var/lib/grafana-data/grafana && chown -R 472:472 /var/lib/grafana-data/grafana"]
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana-data
      containers:
        - name: grafana
          image: grafana/grafana:13.0.2
          ports:
            - containerPort: 3000
          env:
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_PATHS_DATA
              value: /var/lib/grafana-data
            - name: GF_SERVER_DOMAIN
              value: grafana-demo.h0m3.xyz
            - name: GF_SERVER_ROOT_URL
              value: https://grafana-demo.h0m3.xyz/
            - name: GF_SERVER_PROTOCOL
              value: http
            - name: GF_RENDERING_SERVER_URL
              value: http://grafana-image-renderer:8081/render
            - name: GF_RENDERING_CALLBACK_URL
              value: http://grafana:3000/
            - name: GF_RENDERING_RENDERER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-image-renderer
                  key: auth-token
            - name: GF_LOG_FILTERS
              value: rendering:debug
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards/dev
            - name: grafana-uat-dashboards
              mountPath: /var/lib/grafana/dashboards/uat
            - name: grafana-logs-dashboards
              mountPath: /var/lib/grafana/dashboards/logs
            - name: grafana-data
              mountPath: /var/lib/grafana-data
              subPath: grafana
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
        - name: grafana-uat-dashboards
          configMap:
            name: grafana-uat-dashboards
        - name: grafana-logs-dashboards
          configMap:
            name: grafana-logs-dashboards
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data
