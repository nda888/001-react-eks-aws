apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: dev
  annotations:
    alb.ingress.kubernetes.io/group.name: demo-react-eks-dev
    alb.ingress.kubernetes.io/group.order: "2"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/tags: Project=demo-eks-dev,Environment=dev,ManagedBy=kubernetes,Name=demo-eks-dev-alb
    alb.ingress.kubernetes.io/security-groups: PLACEHOLDER_FRONTEND_SG,PLACEHOLDER_BACKEND_SG
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
spec:
  ingressClassName: alb
  rules:
    - host: grafana-demo.h0m3.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
