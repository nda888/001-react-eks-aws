apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-react-eks
  namespace: dev
  annotations:
    alb.ingress.kubernetes.io/group.name: demo-react-eks-dev
    alb.ingress.kubernetes.io/group.order: "1"
    alb.ingress.kubernetes.io/load-balancer-name: demo-react-eks-dev
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/subnets: PLACEHOLDER_ALB_SUBNET_IDS
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: PLACEHOLDER_ACM_CERTIFICATE_ARN
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    # Target group
    # 15s interval + 2 thresholds gives about 30s healthy/unhealthy detection.
    # 5s timeout is safe because /healthz is lightweight.
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/success-codes: "200"
    
    # 30s deregistration delay avoids AWS default 300s stale-target draining.
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30

    alb.ingress.kubernetes.io/tags: Project=demo-eks-dev,Environment=dev,ManagedBy=kubernetes,Name=demo-eks-dev-alb
    alb.ingress.kubernetes.io/security-groups: PLACEHOLDER_FRONTEND_SG,PLACEHOLDER_BACKEND_SG
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
spec:
  ingressClassName: alb
  rules:
    - host: demo-react-eks.h0m3.xyz
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
