apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mongo-app-secret
  namespace: uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: mongo-app-secret
    creationPolicy: Owner
  data:
    - secretKey: MONGO_APP_USERNAME
      remoteRef:
        key: /demo-eks-uat/mongo/app_username
    - secretKey: MONGO_APP_PASSWORD
      remoteRef:
        key: /demo-eks-uat/mongo/app_password
    - secretKey: MONGODB_URI
      remoteRef:
        key: /demo-eks-uat/mongo/app_mongodb_uri
