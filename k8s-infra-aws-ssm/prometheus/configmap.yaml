apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: dev
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alloy-rules.yml
      - /etc/prometheus/loki-rules.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - dev
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            action: keep
            regex: true
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels:
              - __meta_kubernetes_namespace
            action: replace
            target_label: namespace
          - source_labels:
              - __meta_kubernetes_pod_name
            action: replace
            target_label: pod

      - job_name: kubernetes-cadvisor
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels:
              - __meta_kubernetes_node_name
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

      - job_name: kubernetes-kubelet
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels:
              - __meta_kubernetes_node_name
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics
  alloy-rules.yml: |
    groups:
      - name: alloy
        rules:
          - alert: AlloyMemoryWarning
            expr: max by (pod) (process_resident_memory_bytes{namespace="dev", app="alloy"}) > 187904819
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Alloy memory above 70% of 256Mi limit"
              runbook: "kubectl -n dev rollout restart ds/alloy"

          - alert: AlloyHighMemory
            expr: max by (pod) (process_resident_memory_bytes{namespace="dev", app="alloy"}) > 228170137
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Alloy memory above 85% of 256Mi limit"
              description: "Alloy pod {{ $labels.pod }} RSS memory has stayed above 217.6Mi for 10m."
              runbook: "kubectl -n dev rollout restart ds/alloy"
  loki-rules.yml: |
    groups:
      - name: loki
        rules:
          - alert: LokiStorageWarning
            expr: kubelet_volume_stats_used_bytes{namespace="dev", persistentvolumeclaim="loki-data"} / kubelet_volume_stats_capacity_bytes{namespace="dev", persistentvolumeclaim="loki-data"} > 0.70
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Loki storage above 70% capacity"
              description: "Loki PVC {{ $labels.persistentvolumeclaim }} is using {{ $value | humanizePercentage }} of 5Gi capacity."
              runbook: "Check retention config or resize PVC: kubectl -n dev get pvc loki-data"

          - alert: LokiStorageCritical
            expr: kubelet_volume_stats_used_bytes{namespace="dev", persistentvolumeclaim="loki-data"} / kubelet_volume_stats_capacity_bytes{namespace="dev", persistentvolumeclaim="loki-data"} > 0.85
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Loki storage above 85% capacity"
              description: "Loki PVC {{ $labels.persistentvolumeclaim }} is using {{ $value | humanizePercentage }} of 5Gi capacity. Immediate action required."
              runbook: "Resize PVC or reduce retention: kubectl -n dev patch pvc loki-data -p '{\"spec\":{\"resources\":{\"requests\":{\"storage\":\"10Gi\"}}}}'"

